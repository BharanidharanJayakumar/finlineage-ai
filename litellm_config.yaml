# LiteLLM Gateway config — Layer 8 (Phase 2, Wk 14)
#
# All 5 AI chains call Gemini/Groq through this one proxy instead of the provider
# SDKs directly. Gets virtual keys, budgets, automatic fallback, response caching,
# and one log format for free, at ₹0 added cost (LiteLLM + Redis are both OSS).
#
# POC note: this is a single docker-compose service with no Postgres behind it, so
# "virtual keys" here means a single shared LITELLM_MASTER_KEY (set in .env) rather
# than per-team DB-backed keys — budgets/fallback/caching all still work without a DB.

model_list:
  # AI-1 (narrative) and AI-3 (judge) — Gemini 2.5 Flash. Free-tier quota is
  # narrower than first documented here: a live 429 on 2026-09-02 showed
  # generativelanguage.googleapis.com's free-tier daily quota for this model
  # at 20 requests/day (generate_content_free_tier_requests), not 250 — easy
  # to exhaust across a few DAG re-triggers in one testing session. The
  # fallback below is what actually saves a run once that's hit; it only
  # works now that it points at a real Groq model (see below).
  - model_name: finlineage-narrative
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      temperature: 0.3
      max_tokens: 4096
    model_info:
      id: finlineage-narrative

  # Fallback target when Gemini free-tier rate limit is hit mid-DAG — Groq instead
  # of failing the AI-1/AI-3 task outright.
  #
  # groq/llama-3.3-70b-versatile was shut down by Groq on 2026-08-16 (see
  # https://console.groq.com/docs/deprecations) — confirmed live against a
  # real DAG run on 2026-09-02: every call returned
  # `litellm.NotFoundError: GroqException - ... model_not_found`. Switched to
  # openai/gpt-oss-120b, Groq's own listed replacement for this deprecation
  # (a Groq-hosted OpenAI OSS model, not an actual OpenAI API call — the
  # "openai/" here is part of Groq's own model id, hence the doubled prefix
  # below: groq/<groq's model id>).
  - model_name: finlineage-narrative-fallback
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.3
      max_tokens: 4096
    model_info:
      id: finlineage-narrative-fallback

  # AI-2 (transformation docs) — was Groq Llama 3.3 70B; that model was shut
  # down by Groq on 2026-08-16 (see note above). Switched to openai/gpt-oss-120b.
  - model_name: finlineage-docs
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.2
      max_tokens: 1000
    model_info:
      id: finlineage-docs

  # AI-4 (variance tool-calling agent) — Gemini 2.5 Flash, low temperature for
  # deterministic tool selection.
  - model_name: finlineage-agent
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      temperature: 0.1
      max_tokens: 2048
    model_info:
      id: finlineage-agent

  # Fallback for AI-4 — added 2026-09-02 after a live run showed ai4 has no
  # fallback at all: finlineage-narrative and finlineage-agent both proxy to
  # the SAME underlying gemini-2.5-flash model/key, so Google's 20-req/day
  # free-tier quota is one shared budget across ai1+ai3+ai4, not 20 each.
  # Only finlineage-narrative had a fallback mapped, so a quota hit on ai4
  # specifically failed the task outright instead of trying Groq — this
  # closes that gap.
  #
  # CAVEAT — not yet verified end-to-end: ai4 does LangChain tool-calling
  # (bind_tools). openai/gpt-oss-120b is generally built for agentic/tool
  # use, so this should work, but I haven't been able to confirm Groq's
  # tool-calling behavior for this model from here — needs a real run where
  # this fallback actually fires (e.g. by triggering the DAG again while the
  # Gemini quota is still exhausted) to be sure it's not just a different
  # failure mode.
  - model_name: finlineage-agent-fallback
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.1
      max_tokens: 2048
    model_info:
      id: finlineage-agent-fallback

litellm_settings:
  # Gemini free tier is actually 20 requests/day for gemini-2.5-flash (see
  # note above) — if AI-1/AI-3/AI-4 hit that limit mid-DAG, fall back to
  # Groq instead of failing the pipeline task.
  fallbacks:
    - finlineage-narrative: ["finlineage-narrative-fallback"]
    - finlineage-agent: ["finlineage-agent-fallback"]
  num_retries: 2
  request_timeout: 45

  # Response cache — repeat calls (e.g. re-running a DAG task, or a reviewer
  # re-opening a claim) don't re-spend free-tier quota for an identical prompt.
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 3600  # 1hr

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Every model above is a free-tier key — spend should always be exactly ₹0.
  # This is a guardrail, not a real budget: it should trip if a provider ever
  # starts billing for these calls.
  max_budget: 0.0
  budget_duration: 30d
