name: FinLineage CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Wk16 E2E job below only runs on these two triggers, deliberately never
  # on push/pull_request — see that job's comment for why.
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 1'  # Mondays 03:00 UTC

jobs:
  dbt-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install dbt-core dbt-duckdb duckdb great-expectations pandas python-dotenv

      - name: Install dbt packages
        run: |
          cd finlineage
          dbt deps

      - name: Generate source data
        run: python scripts/generate_sources.py

      - name: Create dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          finlineage:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: '${{ github.workspace }}/data/finlineage.duckdb'
                threads: 4
          EOF

      - name: dbt build (seeds + models + tests)
        run: |
          cd finlineage
          dbt build --vars '{"bronze_path": "${{ github.workspace }}/data/bronze"}' --exclude source:*

      - name: Run GE pre-gates
        run: |
          python ge/g1_raw_gl_completeness.py
          python ge/g2_fx_rate_coverage.py
          python ge/g3_payroll_completeness.py

      - name: Run GE post-gates
        run: |
          python ge/g4_pnl_aggregation_consistency.py
          python ge/g5_cross_mart_consistency.py
          python ge/g6_metric_drift.py

      - name: Verify P&L reconciliation
        run: |
          python -c "
          import duckdb
          conn = duckdb.connect('data/finlineage.duckdb', read_only=True)
          src = conn.execute('SELECT ROUND(SUM(amount_inr),2) FROM main.int_entries_cost_centre_mapped').fetchone()[0]
          mrt = conn.execute('SELECT ROUND(SUM(revenue+cogs+opex),2) FROM main.mart_pnl_summary').fetchone()[0]
          diff = abs(src - mrt)
          print(f'Source: {src:,.2f}  Mart: {mrt:,.2f}  Diff: {diff:.2f}')
          assert diff < 0.01, f'RECONCILIATION FAILED: diff={diff}'
          print('RECONCILIATION PASSED')
          "

  deploy-docs:
    needs: dbt-build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install dbt-core dbt-duckdb duckdb python-dotenv

      - name: Install dbt packages
        run: |
          cd finlineage
          dbt deps

      - name: Generate source data
        run: python scripts/generate_sources.py

      - name: Create dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          finlineage:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: '${{ github.workspace }}/data/finlineage.duckdb'
                threads: 4
          EOF

      - name: dbt build
        run: |
          cd finlineage
          dbt build --vars '{"bronze_path": "${{ github.workspace }}/data/bronze"}' --exclude source:*

      - name: dbt docs generate
        run: |
          cd finlineage
          dbt docs generate --vars '{"bronze_path": "${{ github.workspace }}/data/bronze"}'

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: finlineage/target

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Wk16 — full Docker/Airflow E2E suite (tests/test_e2e_pipeline.py).
  #
  # Deliberately NOT on every push/PR: ai1/ai2/ai3/ai4 share Gemini's
  # 20-requests/day free-tier quota with your own local runs on the same
  # Google Cloud project key (see FINLINEAGE_PROJECT_KNOWLEDGE_BASE_1.md
  # Section 7.4 — this is the same quota that was fully exhausted live on
  # 2026-09-02). Running this job on every commit would compete with your
  # own local testing for that one shared daily budget and could exhaust it
  # before you get to test yourself. Trigger it by hand from the Actions
  # tab (Run workflow) whenever you want fresh E2E evidence, or let the
  # weekly schedule above produce it automatically. The lighter
  # dbt-build-and-test job above still runs on every push, same as before.
  e2e-docker-airflow:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest requests duckdb pandas

      # Values come from repo secrets (Settings -> Secrets and variables ->
      # Actions). GEMINI_API_KEY / GROQ_API_KEY / LITELLM_MASTER_KEY are
      # required for ai1-ai4 to have any chance of succeeding here; the
      # DATABRICKS_* ones are optional — if unset, sync_gold_to_databricks
      # legitimately fails and the suite's
      # test_external_service_task_succeeds_or_is_unconfigured test treats
      # that as expected, not a failure.
      - name: Write .env for docker-compose
        run: |
          cat > .env << EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          LITELLM_MASTER_KEY=${{ secrets.LITELLM_MASTER_KEY }}
          LITELLM_BASE_URL=http://localhost:4000
          DATABRICKS_SERVER_HOSTNAME=${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
          DATABRICKS_HTTP_PATH=${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_ACCESS_TOKEN=${{ secrets.DATABRICKS_ACCESS_TOKEN }}
          DATABRICKS_CATALOG=${{ secrets.DATABRICKS_CATALOG }}
          DATABRICKS_SCHEMA=${{ secrets.DATABRICKS_SCHEMA }}
          EOF

      # The airflow-standalone container runs as the image's baked-in
      # non-root user (UID 50000). On a fresh checkout, data/ doesn't exist
      # yet -- Docker creates it root-owned with restrictive permissions the
      # moment the bind mount is set up, and generate_sources.py then can't
      # write into it (same for finlineage/target/ once dbt build runs).
      # This never shows up on Windows/Docker Desktop, which doesn't
      # enforce Linux UID permissions on bind mounts the same way -- it's
      # CI-runner-specific. Harmless to chmod 777 here: this is a throwaway
      # VM torn down at the end of the job, not your machine.
      - name: Pre-create mounted directories with open permissions
        run: |
          mkdir -p data finlineage/target finlineage/logs finlineage/dbt_packages
          chmod -R 777 data finlineage

      - name: Bring up the docker-compose stack
        run: docker compose up -d --build

      - name: Run the E2E pytest suite
        env:
          E2E_TEARDOWN: "1"
          E2E_DAG_TIMEOUT_S: "1500"
        run: pytest tests/ -v

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down
