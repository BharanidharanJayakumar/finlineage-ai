x-airflow-common: &airflow-common
  # Custom-built image (Wk12) — see docker/Dockerfile.airflow for why. The
  # stock apache/airflow image has no venv for dbt/GE/LangChain, so every
  # DAG task was failing before this: {PROJECT_ROOT}/.venv/bin/python
  # referred to nothing inside the container.
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    _AIRFLOW_DB_MIGRATE: 'true'
    _AIRFLOW_WWW_USER_CREATE: 'true'
    _AIRFLOW_WWW_USER_USERNAME: admin
    _AIRFLOW_WWW_USER_PASSWORD: admin
    # Inside the compose network, AI chains reach the gateway by service name —
    # this overrides whatever LITELLM_BASE_URL is set to in .env for host runs.
    LITELLM_BASE_URL: http://litellm-gateway:4000
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/project/data
    - ./scripts:/opt/airflow/project/scripts
    - ./ge:/opt/airflow/project/ge
    - ./ai_chains:/opt/airflow/project/ai_chains
    - ./finlineage:/opt/airflow/project/finlineage
    - ./review_queue_schema.sql:/opt/airflow/project/review_queue_schema.sql
    - ./doc_drift_schema.sql:/opt/airflow/project/doc_drift_schema.sql
    - ./synthetic_anomaly_schema.sql:/opt/airflow/project/synthetic_anomaly_schema.sql
    - ./.env:/opt/airflow/project/.env

services:
  airflow-standalone:
    <<: *airflow-common
    command: standalone
    ports:
      - "8080:8080"
    depends_on:
      - litellm-gateway

  # Backs the LiteLLM gateway's response cache (Section 7.4). LiteLLM falls back to
  # in-memory caching on its own if this is ever omitted, so it's not a hard dependency.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Layer 8 — unified proxy in front of Gemini + Groq for every AI chain.
  litellm-gateway:
    image: ghcr.io/berriai/litellm:main-stable
    env_file:
      - .env
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    depends_on:
      - redis
    restart: unless-stopped
